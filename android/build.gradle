// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // freeRASP（Talsec）制品仓
        maven { url "https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp" }
        maven { url "https://europe-west3-maven.pkg.dev/talsec-artifact-repository/common" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 本机若无 JDK 21，统一降到 17（Capacitor 7 默认写 VERSION_21）。
// cap sync 后若又被改回 21，执行: node tools/patch-android-java17.mjs
subprojects { sub ->
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin('com.android.library') || sub.plugins.hasPlugin('com.android.application')) {
            sub.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        sub.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
    }
}
