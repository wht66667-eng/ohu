name: ohu-website

services:
  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      OHU_DOMAIN: ${OHU_DOMAIN:?Set OHU_DOMAIN in deploy/alibaba/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${OHU_DIST_PATH:-../../dist}:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
