<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课表查询 · 江苏海洋大学</title>
<style>
  :root{--blue:#1E6FD9;--ink:#1F3A5F;--faint:#7C93AD;--bg:#F3F7FC;--line:#DCE8F5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px 16px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:var(--faint);font-size:13px;margin-bottom:20px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(30,111,217,.08);margin-bottom:16px}
  .row{display:flex;gap:10px;margin-bottom:12px}
  input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  input:focus{border-color:var(--blue)}
  .cap{display:flex;gap:10px;margin-bottom:12px}
  .cap input{flex:1}
  .cap-img{height:42px;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
  button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{font-size:13px;margin-top:8px;text-align:center;min-height:18px}
  .msg.err{color:#D64545}
  .msg.ok{color:#2E8B57}
  /* 周视图 */
  #view{display:none}
  .wk-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .wk-bar select,.wk-bar button.small{width:auto;padding:8px 14px;font-size:13px;border-radius:8px}
  .wk-bar button.small{background:#E5F0FC;color:var(--blue);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:44px repeat(7,1fr);grid-template-rows:26px repeat(11,44px);gap:4px}
  .hd{font-size:12px;text-align:center;color:var(--faint);padding:4px 0}
  .hd.today{color:var(--blue);font-weight:bold}
  .axis{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--faint);background:#EDF5FD;border-radius:6px;padding:4px 0}
  .axis .sn{font-size:11px;font-weight:bold;color:var(--ink)}
  .axis .tm{width:38px;text-align:center;border-bottom:1px dashed transparent}
  .col{display:grid;grid-auto-rows:44px;gap:0;position:relative}
  .cell{border-radius:8px;margin:2px;padding:6px 5px;font-size:11px;line-height:1.25;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .cell b{font-size:11px;font-weight:600}
  .cell i{font-style:normal;font-size:10px;opacity:.85}
  .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>课表查询</h1>
  <div class="sub">江苏海洋大学 · 正方教务系统</div>

  <div class="card" id="form">
    <div class="row"><input id="stuid" placeholder="学号" autocomplete="off"></div>
    <div class="row"><input id="pwd" type="password" placeholder="教务密码"></div>
    <div class="cap">
      <input id="cap" placeholder="验证码" maxlength="10">
      <img id="capimg" class="cap-img" title="看不清？点击刷新" alt="验证码">
    </div>
    <button id="go">查 询 课 表</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="view">
    <div class="card">
      <div class="wk-bar">
        <select id="wk"></select>
        <button class="small" id="re">↻ 重新查询</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="hint">连续多节的同一门课已自动合并显示</div>
    </div>
  </div>
</div>

<script>
const NS = 11;
const TM = [["08:05","08:55"],["08:55","09:45"],["10:00","10:45"],["10:55","11:40"],["14:30","15:15"],["15:25","16:10"],["16:20","17:05"],["17:15","18:00"],["18:10","18:55"],["19:30","20:15"],["20:25","21:10"]];
const PAL = ["#4A90D9","#5BAE8C","#E8A04C","#9B7BD8","#D9737F","#54B8C4","#C4835B","#7A93E8"];
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
let SID = null, ALL = [];

const $ = id => document.getElementById(id);

async function loadCaptcha(){
  $("msg").textContent = "";
  try{
    const r = await fetch("/api/timetable/captcha", {method:"POST"});
    const d = await r.json();
    if(d.ok){ SID = d.sid; $("capimg").src = d.image; $("cap").value = ""; }
    else $("msg").textContent = "验证码加载失败，请重试";
  }catch(e){ $("msg").textContent = "无法连接后端服务"; }
}
$("capimg").onclick = loadCaptcha;
window.onload = loadCaptcha;

$("go").onclick = async () => {
  const stuid = $("stuid").value.trim(), pwd = $("pwd").value, cap = $("cap").value.trim();
  if(!stuid || !pwd || !cap){ showMsg("请填写完整学号、密码和验证码", 1); return; }
  $("go").disabled = true; $("go").textContent = "查询中…"; showMsg("");
  try{
    const r = await fetch("/api/timetable/query", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: stuid, password: pwd, captcha: cap, sid: SID})
    });
    const d = await r.json();
    if(d.ok && Array.isArray(d.rows)){
      ALL = d.rows;
      $("form").style.display = "none";
      $("view").style.display = "block";
      buildWeeks(); render();
    }else{
      showMsg(d.message || d.error || "查询失败", 1);
      if(d.code === "1001"){ loadCaptcha(); }
    }
  }catch(e){ showMsg("网络错误，请确认后端服务已启动", 1); }
  $("go").disabled = false; $("go").textContent = "查 询 课 表";
};

function showMsg(t, err){ const m=$("msg"); m.textContent=t||""; m.className="msg"+(err?" err":""); }

$("re").onclick = () => { $("view").style.display="none"; $("form").style.display="block"; loadCaptcha(); };

function buildWeeks(){
  const ws = [...new Set(ALL.map(r=>+r.week).filter(Boolean))].sort((a,b)=>a-b);
  const sel = $("wk"); sel.innerHTML = "";
  ws.forEach(w=>{ const o=document.createElement("option"); o.value=w; o.textContent="第 "+w+" 周"; sel.appendChild(o); });
  sel.onchange = render;
}

function render(){
  const w = +$("wk").value;
  const rows = ALL.filter(r=>+r.week === w);
  const grid = $("grid"); grid.innerHTML = "";
  // 表头
  const today = (new Date().getDay()+6)%7; // 周一=0
  const hd = document.createElement("div"); hd.className="hd"; hd.textContent="节"; grid.appendChild(hd);
  DAYS.forEach((d,i)=>{ const h=document.createElement("div"); h.className="hd"+(i===today?" today":""); h.textContent=d; grid.appendChild(h); });
  // 左侧时间轴
  for(let s=1;s<=NS;s++){
    const a=document.createElement("div"); a.className="axis";
    a.style.gridArea = `${s+1} / 1 / ${s+2} / 2`;
    a.innerHTML = `<span class="sn">${s}</span><span class="tm">${TM[s-1][0]}</span><span class="tm">${TM[s-1][1]}</span>`;
    grid.appendChild(a);
  }
  // 分组合并：同 day+name+room+teacher 的连续节次合成一格
  const groups = {};
  rows.forEach(r=>{
    const ss = Array.isArray(r.sections)&&r.sections.length ? r.sections : [1];
    const s0 = Math.max(1, ss[0]||1), s1 = Math.min(NS, Math.max(s0, ss[ss.length-1]||s0));
    const k = (r.day||1)+"|"+r.name+"|"+(r.room||"")+"|"+(r.teacher||"");
    (groups[k] = groups[k] || {day:r.day||1, name:r.name, room:r.room, teacher:r.teacher, ivs:[]}).ivs.push([s0,s1]);
  });
  const colCells = {};
  Object.values(groups).forEach(g=>{
    g.ivs.sort((a,b)=>a[0]-b[0]);
    const mg=[]; g.ivs.forEach(v=>{ const L=mg[mg.length-1]; if(L && v[0]<=L[1]+1){L[1]=Math.max(L[1],v[1])}else{mg.push([v[0],v[1]])} });
    mg.forEach(iv=>{
      const c=document.createElement("div"); c.className="cell";
      c.style.gridArea = `${iv[0]} / ${g.day} / ${iv[1]+1} / ${g.day+1}`;
      c.style.background = PAL[(g.name||"").length % PAL.length];
      c.innerHTML = `<b>${esc(g.name)}</b>` + (g.room?`<i>@${esc(g.room)}</i>`:"") + (g.teacher?`<i>${esc(g.teacher)}</i>`:"");
      c.title = `${g.name}  第${iv[0]}~${iv[1]}节` + (g.room?`  ${g.room}`:"");
      (colCells[g.day] = colCells[g.day] || []).push(c);
    });
  });
  // 每列建一个子网格容器
  for(let d=1; d<=7; d++){
    const col=document.createElement("div"); col.className="col";
    col.style.gridArea = `2 / ${d+1} / ${NS+2} / ${d+2}`;
    (colCells[d]||[]).forEach(c=>col.appendChild(c));
    grid.appendChild(col);
  }
}

function esc(s){ return String(s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
</script>
</body>
</html>
