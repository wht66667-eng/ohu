name: Flutter CI

on:
  push:
    paths:
      - 'flutter_app/**'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze-test:
    name: 静态分析与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: dart analyze lib test
      - run: flutter test

  android-debug-build:
    name: Android 开发构建
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ohu-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
