<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 196" fill="none" role="img" aria-labelledby="ink-fox-title ink-fox-desc">
  <title id="ink-fox-title">墨滴阿狐</title>
  <desc id="ink-fox-desc">一只俏皮的小狐狸由深浅墨色画成，白色脸颊像纸面留白，卷起的尾巴带起几颗小墨滴。</desc>
  <defs>
    <linearGradient id="ink-fox-head" x1="52" y1="38" x2="136" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555550"/>
      <stop offset=".36" stop-color="#282825"/>
      <stop offset=".78" stop-color="#111110"/>
      <stop offset="1" stop-color="#30302D"/>
    </linearGradient>
    <linearGradient id="ink-fox-tail" x1="195" y1="32" x2="145" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B6B65"/>
      <stop offset=".37" stop-color="#363632"/>
      <stop offset=".8" stop-color="#171716"/>
      <stop offset="1" stop-color="#282826"/>
    </linearGradient>
    <linearGradient id="ink-fox-paper" x1="94" y1="80" x2="94" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFC"/>
      <stop offset="1" stop-color="#ECECE6"/>
    </linearGradient>
  </defs>

  <!-- 尾尖的散墨和底部笔触保留透明背景 -->
  <path d="M205 18c3-4 7-5 9-3 2 3-2 8-6 10-3 1-5-3-3-7Z" fill="#464643" opacity=".79"/>
  <path d="M221 30c3-1 6-1 7 1 1 3-4 5-7 5-3 0-3-4 0-6Z" fill="#676761" opacity=".66"/>
  <circle cx="229" cy="48" r="1.9" fill="#555550" opacity=".48"/>
  <path d="M26 121c-4-2-8-2-9 0-1 3 4 6 8 6 3 0 4-4 1-6Z" fill="#595954" opacity=".61"/>
  <circle cx="16" cy="135" r="1.5" fill="#5F5F59" opacity=".43"/>
  <path d="M25 177c28-8 68-11 99-11 33 0 65 5 91 9-23 0-45 1-63 4-43 8-89 6-127-2Z" fill="#353532" opacity=".12"/>
  <path d="M42 182c20 4 49 5 75 2 13-2 30-2 45-1-18 1-31 3-43 4-29 4-59 0-77-5Z" fill="#55554F" opacity=".15"/>

  <!-- 卷尾从浓墨过渡到露出纸色的尾尖 -->
  <path d="M125 144c14-5 28-8 38-18 10-10 13-22 10-31-2-8-9-13-10-21-3-17 16-23 34-42 2 9 11 18 15 32 10 34-4 67-32 86-16 11-34 16-53 14l-11-8 9-12Z" fill="url(#ink-fox-tail)"/>
  <path d="M197 32c-13 15-24 20-30 29 4-3 9-5 12-4 4 1 4 5 4 9 3-5 6-7 9-5 5 2 4 7 8 12 2-8 6-10 10-9-4-12-10-21-13-32Z" fill="url(#ink-fox-paper)"/>
  <path d="M207 85c-1 25-14 44-36 55-8 4-17 7-26 8 15-6 27-12 36-21 10-9 17-24 21-37 1-5 3-7 5-5Z" fill="#B0B0A6" opacity=".22"/>

  <!-- 脸颊用大片留白，边缘保留尖尖的狐狸轮廓 -->
  <path d="M54 137c-12-3-21-8-29-16 5 0 9-1 13-3-5-5-8-9-10-15l11 2c-3-14-3-37 2-63 2-11 5-20 8-24 13 3 28 16 41 35 8-2 16-2 24-1 13-19 31-30 47-32 6 17 6 44 2 67-1 7-2 12-4 17l11-2c-2 6-6 12-11 16l11 1c-12 12-26 18-46 23 11 4 19 9 21 17 2 8-6 13-15 14H78c-12 0-18-5-16-12 1-6 5-11 12-16-8-2-15-4-20-8Z" fill="url(#ink-fox-head)"/>
  <path d="M45 66c1-14 5-29 8-35 11 5 21 16 27 25-12 1-24 4-35 10Zm79-10c8-12 19-20 32-24 1 11 1 22-1 31-10-4-21-7-31-7Z" fill="#9D9D93"/>
  <path d="M48 60c1-8 3-16 6-22 6 4 12 9 16 15-8 1-15 4-22 7Zm86-6c6-7 13-13 20-16l-1 15c-6 1-12 1-19 1Z" fill="#CECEC4" opacity=".63"/>
  <path d="M31 107c10 0 15-11 22-18 9-10 24-8 36 2 5 4 7 10 12 10s8-6 12-10c10-9 23-13 34-5 7 6 9 15 17 17l4 1c-2 6-8 12-15 15l12 1c-16 13-40 19-65 20-28 0-49-7-71-18l15-4c-7-3-11-7-13-11Z" fill="url(#ink-fox-paper)"/>
  <path d="M70 147c10 1 18 0 29-2 11 2 20 3 29 1-3 11-13 16-28 16-13 0-24-4-30-15Z" fill="#C5C5BA" opacity=".81"/>
  <path d="M73 169c4-4 10-5 15-4m28 0c6 0 12 1 16 4" stroke="#AAAAA0" stroke-width="1.4" stroke-linecap="round" opacity=".54"/>

  <!-- 一只眼睛微眯，另一只眼睛带墨点高光 -->
  <path d="M63 106c5-6 11-6 15-1" stroke="#1C1C1A" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M117 105c0-4 2-7 5-7s5 3 5 7-2 7-5 7-5-3-5-7Z" fill="#1C1C1A"/>
  <circle cx="123.6" cy="102.4" r="1.45" fill="#FFFFFC"/>
  <path d="M94 109c3-2 8-2 11 0 2 2-2 6-5 6s-8-4-6-6Z" fill="#1C1C1A"/>
  <path d="M100 115c-2 5-7 6-10 3m10-3c1 4 5 6 9 3" stroke="#1C1C1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="m54 114 3 2m1-4 3 2m77 0-3 2m0-4-3 2" stroke="#787873" stroke-width="1.25" stroke-linecap="round" opacity=".76"/>
  <path d="M80 69c10-4 25-5 36-1" stroke="#A0A096" stroke-width="1.5" stroke-linecap="round" opacity=".36"/>
</svg>
