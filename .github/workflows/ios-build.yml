name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "ios/**"
      - "patches/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tools/build-multiplatform.mjs"
      - "tools/ios-download-release.mjs"
      - "tools/verify-ios-ipa.py"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release identity
        id: identity
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readReleaseIdentity } from './tools/release-common.mjs';
          const identity = readReleaseIdentity();
          if (identity.version !== identity.nativeVersion || identity.nativeBuild !== identity.webBuild) {
            throw new Error('Web and native release identities must match before building iOS.');
          }
          console.log(`version=${identity.nativeVersion}`);
          console.log(`build=${identity.nativeBuild}`);
          NODE

      - name: Build student web bundle
        run: npm run build:app -- --shell user --no-sync

      - name: Verify CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Generate and sync Capacitor iOS project
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios
          plutil -replace NSCameraUsageDescription -string '扫描哦狐好友二维码以发送好友申请' ios/App/App/Info.plist
          plutil -replace NSPhotoLibraryUsageDescription -string '选择照片用于编辑和发布朋友圈，仅处理你选中的照片' ios/App/App/Info.plist
          test -d ios/App/App.xcworkspace
          sips -s format png -z 1024 1024 public/download/student-icon.png \
            --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Build unsigned iPhone app
        env:
          APP_VERSION: ${{ steps.identity.outputs.version }}
          APP_BUILD: ${{ steps.identity.outputs.build }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ohu-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            INFOPLIST_KEY_CFBundleDisplayName='哦狐' \
            build

      - name: Package and verify IPA
        env:
          APP_VERSION: ${{ steps.identity.outputs.version }}
          APP_BUILD: ${{ steps.identity.outputs.build }}
        run: |
          set -o pipefail
          APP_PATH="$RUNNER_TEMP/ohu-derived/Build/Products/Release-iphoneos/App.app"
          export APP_PATH
          test -d "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/ios-diagnostics"
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          runner_temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          expected = runner_temp / 'ohu-derived/Build/Products/Release-iphoneos/App.app'
          candidate = Path(os.environ['APP_PATH'])
          app = candidate.resolve(strict=True)
          if candidate.is_symlink() or app != expected or not app.is_dir():
              raise SystemExit('Refusing signature cleanup outside the exact generated App.app')
          def confined(path):
              resolved = path.resolve(strict=True)
              if path.is_symlink() or not resolved.is_relative_to(app):
                  raise SystemExit(f'Refusing signature cleanup through an external/symlink path: {path}')
              return path
          report = {'app': str(app), 'unsignedBundles': [], 'removedMetadata': []}
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'ios-diagnostics/signing-cleanup.json'
          try:
              bundles = [p for p in app.rglob('*') if p.is_dir() and p.suffix in {'.framework', '.app', '.appex', '.bundle'}]
              for bundle in sorted(bundles, key=lambda p: len(p.parts), reverse=True) + [app]:
                  confined(bundle)
                  signed = subprocess.run(['codesign', '-dv', str(bundle)], capture_output=True)
                  if signed.returncode == 0:
                      subprocess.run(['codesign', '--remove-signature', str(bundle)], check=True)
                      report['unsignedBundles'].append(str(bundle.relative_to(app)))
              # Resource bundles can contain stale signing metadata even without a signed executable.
              for metadata in sorted(app.rglob('_CodeSignature'), key=lambda p: len(p.parts), reverse=True):
                  confined(metadata)
                  if metadata.is_dir():
                      shutil.rmtree(metadata)
                  else:
                      metadata.unlink()
                  report['removedMetadata'].append(str(metadata.relative_to(app)))
              for profile in app.rglob('*.mobileprovision'):
                  confined(profile).unlink()
                  report['removedMetadata'].append(str(profile.relative_to(app)))
          finally:
              output.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
          IPA_NAME="Ohhu-user-${APP_VERSION}-${APP_BUILD}-unsigned.ipa"
          PACKAGE_ROOT="$RUNNER_TEMP/ohu-ipa"
          mkdir -p "$PACKAGE_ROOT/Payload" "$GITHUB_WORKSPACE/ios-release"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/App.app"
          (cd "$PACKAGE_ROOT" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/ios-release/$IPA_NAME" Payload)
          python3 tools/verify-ios-ipa.py \
            --ipa "ios-release/$IPA_NAME" \
            --manifest ios-release/ios-latest.json \
            --version "$APP_VERSION" \
            --build "$APP_BUILD" 2>&1 | tee "$GITHUB_WORKSPACE/ios-diagnostics/verification.txt"

      - name: Upload unsigned IPA and verified manifest
        uses: actions/upload-artifact@v4
        with:
          name: ohhu-ios-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.build }}
          path: ios-release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed-build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ohhu-ios-diagnostics-${{ github.run_id }}
          path: |
            ios-diagnostics/
            ios-release/*.ipa
          if-no-files-found: warn
          retention-days: 7
