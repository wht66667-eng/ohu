          - listitem [ref=e58]: 生活：广场、互助任务、二手集市。运动中心可手动记录健康数据、参加阳光跑小队；轨迹与实时配速尚未开放。
          - listitem [ref=e59]: 哦狐科技：用户或开发者可通过“提交插件接入方案”留言申请；管理员审核并完成接入核验前，插件不会进入哦狐。当前已提供方案留言入口，插件目录、代码沙箱和运行时仍在建设；“我的网页快捷入口”仅保存本机 HTTPS 链接。
