        - heading "免责声明与使用须知" [level=2] [ref=e41]
        - list [ref=e42]:
          - listitem [ref=e43]: 哦狐提供校园信息、学业整理、提醒、社区交流和工具入口。它是辅助工具，不是学校、教务部门、考试机构或医疗机构的官方系统；涉及校方安排、成绩、考试、学籍、体测与办事规则，请以学校及主管机构正式信息为准。
          - listitem [ref=e44]: 课表、成绩、考试和体测数据可能来自用户导入、教务接口或公开页面。同步、识别、解析和提醒可能受网络、验证码、学校系统改版、设备权限或数据源延迟影响；请在使用前自行核对课程、日期、地点和成绩，不能仅依赖哦狐避免缺考、迟到或错过截止时间。
          - listitem [ref=e45]: AI、自动识别、计划建议与内容摘要可能不完整或不准确，不构成教师、律师、医生、心理咨询师或其他专业人士意见，也不会代替用户确认。将个人通知、图片或课程信息发送给 AI 前，请阅读页面的数据范围提示；不要提交密码、验证码、身份证件或无关他人隐私。
          - listitem [ref=e46]: 广场、聊天、互助、碰个空、二手及插件提案可能包含用户提交内容。发布者应保证有权发布并遵守法律，不得侵犯他人著作权、肖像权、隐私权、名誉权或其他合法权益；发现违法、欺诈、骚扰或侵权内容，请及时举报。平台会按规则审核、限制展示或下架内容，但不保证每条用户内容已经事先核实。
          - listitem [ref=e47]: 同学之间的交易、拼单、线下活动和见面由参与者自行确认身份、价格、时间、地点与安全措施。哦狐不代替双方签约、验货、付款或履约；请勿向陌生人转账或提供验证码。平台仍依法履行适用的内容治理、个人信息保护及其他法定义务，本说明不免除法律禁止免除的责任。
          - listitem [ref=e48]: 教务账号密码只用于用户主动发起的学校服务流程；如选择记住密码，也仅在本机保存。请勿在公用设备保存凭据，不要把账号密码、验证码或带凭据的链接提交给插件作者、其他用户或管理员。具体收集、使用、保存、共享与删除规则以隐私政策为准。
          - listitem [ref=e49]: 外部网站、学校系统、第三方服务和用户提交插件可能有各自的规则、隐私政策、可用性与安全风险。哦狐科技的插件须由开发者提交并经管理员审核，通过后方可接入；审核不代表对插件作者、外部服务或其全部输出作担保。当前服务页“我的网页快捷入口”只是本机 HTTPS 快捷链接，不是插件代码执行或公共插件市场。
          - listitem [ref=e50]: 服务可能因维护、网络、设备兼容、第三方故障或不可抗力暂时不可用。请及时保存重要资料，并保留学校官方渠道作为备份。法律不允许排除或限制的消费者权利、个人信息权利及其他法定权利，不因本说明而受影响。
          - listitem [ref=e51]: 继续使用前，请阅读并确认《用户协议》和《隐私政策》。重要条款会以清晰方式提示；不同意时可以停止使用。未满 18 周岁的用户应在监护人指导下阅读，并按法律规定取得必要同意。
        - heading "快速说明书" [level=2] [ref=e52]
        - list [ref=e53]:
          - listitem [ref=e54]: 登录：手机号注册 / 验证码登录，设置密码后可用「手机号或学号 + 密码」登录；不再使用教务密码登录 App。
